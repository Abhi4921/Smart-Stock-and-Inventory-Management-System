<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Database Dashboard</title>
    <meta name="description" content="A beautiful and modern dynamic database dashboard">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Login Screen -->
    <div id="loginContainer" class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>DBMS Login</h2>
                <p>Welcome back! Please enter your details.</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div id="loginError" class="login-error" style="display: none; color: var(--danger); margin-bottom: 1rem; font-size: 0.875rem;"></div>
                <button type="submit" id="loginBtn" class="btn btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" style="display: none; width: 100%; height: 100vh;">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            DBMS Admin
        </div>
        
        <ul class="nav-links" id="sidebarMenu">
            <!-- Sidebar links populated dynamically by JS -->
            <li class="loading">Loading schema...</li>
        </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="header">
            <div>
                <h1 id="pageTitle">Welcome</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;" id="pageSubtitle">Select a table from the sidebar to manage records.</p>
            </div>
            <div class="user-profile">
                <button class="btn btn-primary" style="width: auto; visibility: hidden" id="headerNewBtn" onclick="document.querySelector('form input').focus()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Record
                </button>
                <div class="avatar" id="userAvatar" title="Logout" style="cursor: pointer;" onclick="logout()">A</div>
            </div>
        </header>

        <div class="dashboard-grid" id="mainDashboard" style="display: none;">
            <!-- Add Product Form Column -->
            <section class="card animate-fade-in" style="animation-delay: 0.1s">
                <div class="card-header">
                    <h2 class="card-title" id="formTitle">Add Record</h2>
                </div>
                
                <form id="dynamicForm">
                    <div id="formInputs">
                        <!-- Inputs populated dynamically -->
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 0.5rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Save Record
                    </button>
                </form>
            </section>

            <!-- Inventory Data Table Column -->
            <section class="card animate-fade-in" style="animation-delay: 0.2s">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="card-title" id="tableTitle">Current Records</h2>
                    <span style="color: var(--text-secondary); font-size: 0.875rem;">Live from MySQL Database</span>
                </div>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr id="tableHeaderRow">
                                <!-- Headers populated dynamically -->
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- Items populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
